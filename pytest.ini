[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers
markers =
    unit: Nível 1 - Testes Unitários Isolados com Mocks
    integration: Nível 1 - Testes de Integração e Atomicidade
    system: Nível 2 - Testes de Sistema Ponta a Ponta
    acceptance: Nível 2 - Testes de Aceitação e BDD